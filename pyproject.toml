[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "celimes-air-quality-package"
version = "0.2.0"
description = "Download, regrid, gap-fill and validate GOES ABI AOD and TEMPO NO2 with HRRR meteorology"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "scipy>=1.9",
    "xarray>=2022.6",
    "netCDF4>=1.6",
    "h5py>=3.7",
    "tables>=3.7",
    "pvlib>=0.9",
    "s3fs>=2023.1",
    "zarr>=2.13",
    "requests>=2.28",
    "tqdm>=4.64",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
era5 = ["cdsapi>=0.7"]
modis = ["pyhdf>=0.10"]
test = ["pytest>=7"]
all = ["cdsapi>=0.7", "pyhdf>=0.10", "pytest>=7"]

[tool.setuptools.packages.find]
include = ["celimes_air_quality_package*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
